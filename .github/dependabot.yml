# Dependency monitoring. Both ecosystems are watched: GitHub Actions are code that runs with access
# to the repository, too.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Grouped: ten isolated PRs get closed unread, one grouped PR gets reviewed.
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-and-tools:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.dagger*"
          - "io.gitlab.arturbosch.detekt*"
      # Jupiter and the JUnit Platform launcher must move TOGETHER: proposed separately on Agenda Tech,
      # each one broke test start-up by putting the other out of step.
      junit:
        patterns:
          - "org.junit*"
    ignore:
      # Kotlin 2.4.20+: CodeQL refuses to compile ("currently supports versions below 2.4.20"). A bump
      # PR would fail on every run. Remove once CodeQL supports it.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.4.20"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
