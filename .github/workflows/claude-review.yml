name: Claude Review

# Review automatique des PR par Claude Code (anthropics/claude-code-action).
# Coût : ~0.10-0.50 € par review (tokens API Anthropic, paye à l'usage).
#
# Mention @claude dans une issue ou PR pour invoquer manuellement.
# Auto-review activé sur opened/synchronize.

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # SEC F24 2026-07-31 — le dépôt est PUBLIC, et un déclencheur
    # `issue_comment` s'exécute dans le contexte du dépôt de BASE, sur la
    # branche par défaut, AVEC les secrets et les permissions déclarées
    # ci-dessous. C'est la différence majeure avec `pull_request` depuis un
    # fork, qui lui reçoit un jeton en lecture seule et aucun secret.
    #
    # Avant, la condition ne filtrait que sur la présence de « @claude » dans
    # le corps du commentaire, SANS aucun contrôle de l'auteur. N'importe quel
    # utilisateur GitHub pouvait donc, en commentant une issue, déclencher ce
    # job avec `contents: write` et la clé `ANTHROPIC_API_KEY`. Deux
    # conséquences concrètes :
    #   - facturation : invocation illimitée d'une API payante (le coût est
    #     estimé plus haut dans ce fichier à 0,10-0,50 € par exécution) ;
    #   - intégrité : sur une mention, l'action suit l'instruction contenue
    #     dans le commentaire — c'est un vecteur d'injection de consigne, avec
    #     un droit d'écriture sur le dépôt.
    #
    # On exige désormais que l'auteur du commentaire soit rattaché au dépôt.
    # `author_association` est calculé par GitHub, pas fourni par l'auteur.
    if: |
      github.event_name == 'pull_request' ||
      (contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # pour commit des fixes si demandé
      pull-requests: write  # pour commenter sur la PR
      issues: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CI 2026-08-04 — le jeton du workflow, au lieu de l'app GitHub.
          #
          # Sans lui, l'action tente d'obtenir un jeton via l'application
          # GitHub « Claude Code », qui n'est pas autorisée sur ce dépôt :
          #   App token exchange failed: 401 Unauthorized
          #   Claude Code is not installed on this repository
          # Le job échouait donc sur CHAQUE pull request, quel qu'en soit le
          # contenu — la clé API était bien présente, c'est l'app qui manquait.
          #
          # Les entrées de l'action décrivent `github_token` comme
          # « optional if using GitHub App » : les deux sont des voies
          # ALTERNATIVES, et le workflow n'en fournissait aucune.
          #
          # `GITHUB_TOKEN` porte déjà les droits nécessaires — ils sont
          # déclarés dans le bloc `permissions:` ci-dessus (contents,
          # pull-requests, issues). Installer l'app reste possible si l'on veut
          # que les commentaires soient signés par elle plutôt que par
          # `github-actions[bot]`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # CI 2026-08-04 — modèle FIXÉ explicitement.
          #
          # Sans cette ligne, l'action retenait `claude-opus-5[1m]`, la variante
          # à contexte étendu, et la requête était rejetée en 440 ms pour un
          # coût de 0 $ — donc refusée avant tout traitement, faute d'accès à ce
          # modèle sur cette clé.
          #
          # Laisser un défaut implicite décider du modèle en intégration
          # continue est de toute façon une mauvaise idée : le coût par revue et
          # la disponibilité changent sans qu'aucun fichier du dépôt ne bouge.
          claude_args: "--model claude-sonnet-5"
          # Prompt pour les auto-reviews PR (skip pour @claude mentions
          # qui suivent l'instruction du commentaire).
          prompt: |
            Review this PR focusing on:
            - Security issues (OWASP Mobile Top 10)
            - Code quality, dead code, duplications
            - Logic errors, edge cases not handled
            - Performance issues (main isolate blocking, leaks)
            Keep comments concise and actionable. Use inline review comments where possible.
            Skip nitpicks. French replies preferred.
