name: CI

# `fix/**` and `feat/**` are triggers on purpose: a work branch that nothing builds can pile up dozens
# of commits with a red detekt nobody sees (measured on a sibling app of the portfolio).
on:
  push:
    branches: [master, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref cancels the previous run: its result is already stale.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate (build · tests · lint · detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # The same command as the local gate, so that CI and a developer's machine can never disagree
      # about what "green" means. detekt is blocking (maxIssues: 0, no baseline). The instrumented
      # tests are compiled, not run: they need a device, and nothing else would notice them broken
      # (a signature change left them uncompilable for a whole feature, 2026-09-22).
      - name: Gate
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest testDebugUnitTest :app:lintDebug detekt

      # R8 decides what actually ships. A debug-only gate never runs it, so a keep rule missing for a
      # class reached by reflection would only show up in the published APK.
      - name: Release build (exercises R8)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
