name: CI

on:
  push:
    branches: [master, 'fix/**', 'feat/**']
  pull_request:
    branches: [master]

jobs:
  build:
    name: Analyze + Test + Build (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout app
        uses: actions/checkout@v6
        with:
          path: pass_tech

      # Le pubspec référence files_tech_core via `path: ../files_tech_core`.
      # On le checkout en sibling pour que `flutter pub get` résolve la dep.
      - name: Checkout files_tech_core (path dependency)
        uses: actions/checkout@v6
        with:
          repository: gitubpatrice/files_tech_core
          path: files_tech_core
          # 2026-07-31 — l'epinglage vit desormais dans `pubspec.yaml`, qui
          # declare files_tech_core en dependance GIT sur un SHA. Ce checkout
          # ne sert plus qu'a garder un repertoire frere pour d'eventuels
          # outils ; `flutter pub get` resout la dependance par le SHA du
          # pubspec, pas par ce repertoire. Un seul endroit a maintenir.
          ref: v0.3.4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: pass_tech
        run: flutter pub get

      # AUDIT 2026-08-03 — `--no-fatal-infos` remplacé par le durcissement de la
      # doctrine (`ci-et-chaine-de-publication.md` §4.1). Vérifié en local avant
      # d'être posé ici : l'analyse rend « No issues found » sur ce dépôt, donc
      # le durcissement ne coûte RIEN aujourd'hui et empêche la dérive demain.
      - name: Analyze
        working-directory: pass_tech
        run: flutter analyze --fatal-infos --fatal-warnings

      # AUDIT 2026-08-03 — nouveau contrôle. `tool/generate_icon.dart` n'était
      # pas formaté au moment de l'ajout : sans cette barrière, le dépôt dérive
      # fichier par fichier et les diffs de revue se noient dans du reformatage.
      - name: Format
        working-directory: pass_tech
        run: dart format --output=none --set-exit-if-changed .

      # ⚠️ AUDIT 2026-08-03 — le `|| echo "No tests yet"` a été RETIRÉ.
      #
      # Il faisait passer le job au vert QUOI QU'IL ARRIVE : un test en échec
      # produisait exactement la même pastille verte qu'une suite intacte. Sur
      # un gestionnaire de mots de passe dont la suite couvre le round-trip
      # AES-GCM, la migration v3→v4 et le rembourrage anti-corrélation, c'est
      # la garantie la plus coûteuse du dépôt qui était neutralisée — et
      # l'écriture même du garde-fou (« pas encore de tests ») avait cessé
      # d'être vraie : il y en a 139.
      #
      # Une CI qui ne peut pas échouer ne teste rien ; elle rassure, ce qui est
      # pire que pas de CI du tout.
      - name: Run tests
        working-directory: pass_tech
        run: flutter test

      # Build debug APK pour valider que la compilation passe end-to-end
      # (pas besoin de keystore release en CI).
      - name: Build APK (debug, unsigned)
        working-directory: pass_tech
        run: flutter build apk --debug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pass_tech-debug-${{ github.sha }}
          path: pass_tech/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: ignore
