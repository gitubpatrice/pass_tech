# Static security analysis.
#
# CodeQL does not read Dart: on the Flutter app it only saw the thin Android shell, and the vault
# crypto stayed out of its reach. In Kotlin it covers the whole app, crypto included. That coverage is
# one of the reasons for the rewrite, which is also why Kotlin is capped below 2.4.20 (see
# gradle/libs.versions.toml).
name: CodeQL

on:
  push:
    branches: [master, 'fix/**', 'feat/**']
  pull_request:
  schedule:
    # Monday morning: a vulnerability published in a dependency does not wait for the next commit.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-and-quality

      # An explicit build rather than `autobuild`: what autobuild guesses wrong, it analyses less, and
      # a partial analysis that presents itself as complete is worse than none.
      #
      # `--no-build-cache --rerun-tasks`: CodeQL only extracts what it SEES being compiled. A Kotlin
      # compilation restored from the cache left it with nothing to analyse on Agenda Tech (2026-09-14),
      # while the build itself was green.
      - name: Build
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks :app:assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
