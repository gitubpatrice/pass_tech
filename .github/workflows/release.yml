name: Release (manuel)

# ⚠️ DÉSACTIVÉ SUR TAG depuis le 2026-07-30 (v2.5.2 / v2.5.3).
#
# Ce workflow créait la release LUI-MÊME au push d'un tag `v*`. Comme les
# releases Files Tech sont préparées à la main (4 APK : 3 splits ABI + 1
# universel, notes bilingues FR/EN détaillées), il entrait en conflit :
#
#   1. Il ÉCRASAIT les notes de release manuelles par un bloc minimal généré.
#   2. Il ajoutait un 5ᵉ asset `pass_tech-v<version>.apk` — un SECOND APK
#      universel construit indépendamment, donc au SHA-256 DIFFÉRENT de celui
#      publié dans les notes. Un utilisateur téléchargeant ce fichier et
#      vérifiant l'empreinte concluait à une falsification : exactement le
#      signal que la vérification d'intégrité de l'app existe pour éviter.
#      (Le certificat de signature, lui, était bien identique.)
#   3. Il étiquetait son APK « APK arm64-v8a » alors que c'est l'universel.
#
# Il ne produit qu'UN seul APK universel là où une release Files Tech en
# publie 4. Passé en déclenchement MANUEL : conservé pour référence et
# utilisable au besoin via l'onglet Actions, mais il ne part plus tout seul.
#
# Les workflows `ci.yml` et `security.yml` restent actifs sur push/PR.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex : v2.5.4). La release doit déjà exister."
        required: true

jobs:
  build-and-release:
    name: Build signed APK + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # nécessaire pour créer la release

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: pass_tech
          # En déclenchement manuel, le défaut serait la branche par défaut et
          # non le tag : on construirait autre chose que la version demandée.
          ref: ${{ inputs.tag }}

      - name: Checkout files_tech_core (path dependency)
        uses: actions/checkout@v4
        with:
          repository: gitubpatrice/files_tech_core
          path: files_tech_core

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from tag
        id: version
        # Le workflow ne se déclenche plus sur push de tag : `GITHUB_REF`
        # pointerait sur la branche, pas sur `refs/tags/vX.Y.Z`. On lit donc
        # le tag depuis l'entrée `workflow_dispatch`, en retirant le `v`.
        run: echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ inputs.tag }}

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > pass_tech/android/passtech-release.jks
          ls -la pass_tech/android/passtech-release.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > pass_tech/android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=passtech-release.jks
          EOF

      - name: Pub get
        working-directory: pass_tech
        run: flutter pub get

      - name: Build APK release (signed)
        working-directory: pass_tech
        run: flutter build apk --release

      - name: Rename + SHA256
        id: sha
        run: |
          SRC=pass_tech/build/app/outputs/flutter-apk/app-release.apk
          DEST=pass_tech-v${{ steps.version.outputs.VERSION }}.apk
          cp "$SRC" "$DEST"
          SHA=$(sha256sum "$DEST" | awk '{print $1}')
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT
          echo "APK_PATH=$DEST" >> $GITHUB_OUTPUT
          echo "APK signé : $DEST"
          echo "SHA-256   : $SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # `github.ref_name` vaudrait la BRANCHE en déclenchement manuel.
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          body: |
            ## Vérification d'intégrité

            ⚠️ Ce corps ÉCRASE des notes de release existantes. Ne lancer ce
            workflow que sur une release qui n'en a pas encore.

            **APK universel** (toutes architectures) : `${{ steps.sha.outputs.APK_PATH }}`

            **SHA-256** :
            ```
            ${{ steps.sha.outputs.SHA256 }}
            ```

            Vérifiez avec :
            ```
            sha256sum pass_tech-v${{ steps.version.outputs.VERSION }}.apk
            ```

            ---

            🤖 Build automatique via GitHub Actions (commit `${{ github.sha }}`)
          files: ${{ steps.sha.outputs.APK_PATH }}

      - name: Cleanup
        if: always()
        run: |
          rm -f pass_tech/android/passtech-release.jks
          rm -f pass_tech/android/key.properties
