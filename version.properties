# Single source of the app version, read by app/build.gradle.kts. Bumped by hand at each release.
#
# The Kotlin app has its own application id (com.filestech.pass_tech), so its versionCode starts a
# new sequence: it never has to exceed the 4042 of the Flutter app (com.passtech.pass_tech), which
# stays installed side by side until the migration is done.
#
# The version shown in the app is read at run time from PackageInfo: there is no constant to bump in
# the code.
versionCode=1
versionName=3.0.0
