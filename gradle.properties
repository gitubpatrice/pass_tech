## Gradle JVM, sized as in SMS Tech and Agenda Tech.
##
## The heap must NOT be too large. With CompressedOops the Java heap is mapped into the first 32 GB
## of address space, and the native heap (KSP and kotlinc metaspace, ZipFile, code cache) grows below
## its base. With -Xmx4g, KSP crashed the daemon on "OutOfMemoryError: malloc failed" in those
## projects; 2 GB is enough and leaves the native side room.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:CompressedClassSpaceSize=256m -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

ksp.useKSP2=true
